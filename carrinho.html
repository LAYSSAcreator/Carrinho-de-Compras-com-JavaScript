<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="carrinho.css">
    <title>Carrinho - Minha Loja Online</title>
</head>

<body>
    <!-- Cabeçalho -->
    <header class="header">
        <h1>Minha Loja Online</h1>

        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#produtos">Produtos</a></li>
                <li><a href="index.html#contato">Contato</a></li>
                <li><a href="carrinho.html"></a>Carrinho</a></li>
            </ul>
        </nav>

        <!-- Mini carrinho -->
        <div class="mini-cart">
            <span>🛒</span>
            <span id="cart-count">0</span>
            <div class="mini-cart-dropdown" id="mini-cart-dropdown">
                <ul id="mini-cart-list"></ul>
                <p id="mini-total">Total: R$ 0</p>
            </div>
        </div>
    </header>


    <main>
        <section class="cart">
            <h2>Meu Carrinho</h2>
            <ul id="cart-list"></ul>
            <p id="total">Total: R$ 0</p>
            <button id="finalizar-compra">Finalizar Compra</button>
            
          
            <p style="margin-top: 15px;">
             <a href="index.html" style="color: var(--primary-color); text-decoration: none;">← Continuar comprando</a>
            </p>
            <p id="mensagem-compra"></p>
        </section>
    </main>

   
    <footer>
        <p>&copy; 2026 Minha Loja Online</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
